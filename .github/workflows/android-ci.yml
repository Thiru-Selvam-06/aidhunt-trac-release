name: Android CI
on:
  push:
    branches: ['main', 'master', 'codex/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: regression-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
env:
  GCLOUD_PROJECT: demo-aidhunt-v16
  FIRESTORE_EMULATOR_HOST: 127.0.0.1:18180
  GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx2048m
  JAVA_TOOL_OPTIONS: -XX:ActiveProcessorCount=2
jobs:
  inventory:
    name: Interaction inventory and test harness guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: python3 -m unittest discover -s scripts -p "test_*.py"
      - run: python3 scripts/interaction_inventory.py --check
      - run: python3 scripts/suite_inventory.py --check --output ci-reports/test-suite-inventory.json
      - run: python3 scripts/publication_guard.py
      - uses: actions/upload-artifact@v4
        with:
          name: interaction-inventory
          path: |
            docs/regression/
            ci-reports/test-suite-inventory.json
  static-checks:
    name: Android compilation and lint (demo configuration)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21', cache: gradle}
      - run: python3 scripts/prepare_ci.py
      - run: chmod +x gradlew
      - run: ./gradlew :app:assembleDebug :app:lintDebug --max-workers=2 --no-configuration-cache
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compilation-lint
          path: |
            app/build/reports/lint*
            app/build/outputs/apk/debug/
  android-tests:
    name: Android ${{ matrix.suite }} regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        suite: [unit, database, compose, outbox]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21', cache: gradle}
      - run: python3 scripts/prepare_ci.py
      - run: chmod +x gradlew
      - uses: actions/setup-node@v4
        if: matrix.suite == 'outbox'
        with: {node-version: '22'}
      - name: Run Android regression partition
        if: matrix.suite != 'outbox'
        run: ./gradlew :app:testDebugUnitTest --init-script scripts/ci-tests.gradle -PciSuite=${{ matrix.suite }} -PciCoverage=true --max-workers=2 --no-configuration-cache
      - name: Run outbox integration and coverage with Firestore Emulator
        if: matrix.suite == 'outbox'
        run: npx --yes firebase-tools@15.33.0 emulators:exec --project demo-aidhunt-v16 --only firestore --config firebase.ci.json "./gradlew :app:testDebugUnitTest :app:createDebugUnitTestCoverageReport --init-script scripts/ci-tests.gradle -PciSuite=outbox -PciCoverage=true --max-workers=2 --no-configuration-cache"
      - name: Generate partition code coverage
        if: matrix.suite != 'outbox'
        run: ./gradlew :app:createDebugUnitTestCoverageReport --init-script scripts/ci-tests.gradle -PciSuite=${{ matrix.suite }} -PciCoverage=true --max-workers=2 --no-configuration-cache
      - name: Report actual JUnit results
        if: always()
        run: python3 scripts/generate_ci_report.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-${{ matrix.suite }}
          path: |
            app/build/test-results/testDebugUnitTest/
            app/build/reports/tests/testDebugUnitTest/
            app/build/reports/coverage/
            app/build/outputs/unit_test_code_coverage/
            ci-reports/
  backend:
    name: Worker, HTTP, deletion, migration and Rules (${{ matrix.suite }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        suite: [backend, rules]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm, cache-dependency-path: 'functions/package-lock.json'}
      - run: npm ci --prefix functions
      - run: npm ci --prefix security-tests
      - run: npx --yes firebase-tools@15.33.0 emulators:exec --project demo-aidhunt-v16 --only firestore --config firebase.ci.json "node scripts/run_backend_suite.mjs ${{ matrix.suite }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-${{ matrix.suite }}
          path: ci-reports/
  device-integration:
    name: Compose controls, Room and representative Android-backend journeys
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      FIREBASE_AUTH_EMULATOR_HOST: 127.0.0.1:19099
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21', cache: gradle}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm ci --prefix functions
      - run: chmod +x gradlew
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: npx --yes firebase-tools@15.33.0 emulators:exec --project demo-aidhunt-v16 --only auth,firestore,functions --config firebase.device-test.json "bash scripts/run_device_ci.sh"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-device-integration
          path: |
            app/build/outputs/androidTest-results/
            app/build/reports/androidTests/
  aggregate:
    name: Regression results and release gate
    needs: [inventory, static-checks, android-tests, backend, device-integration]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: {path: collected-reports}
      - name: Write run identity and job conclusions
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
          REQUIRED_JUNIT_ARTIFACTS: '["android-unit","android-database","android-compose","android-outbox","backend-backend","backend-rules","android-device-integration"]'
        run: |
          mkdir -p ci-reports
          python3 scripts/aggregate_regression.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: full-regression-${{ github.run_id }}
          path: ci-reports/

