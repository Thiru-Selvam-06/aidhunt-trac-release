name: Manual fresh-clone reproducibility
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  demo-clone:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21', cache: gradle}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: python3 scripts/publication_guard.py
      - run: python3 scripts/bootstrap_demo.py
      - run: chmod +x gradlew
      - run: ./gradlew -PdeviceTest=true :app:assembleDeviceTest :app:assembleDeviceTestAndroidTest --max-workers=2 --no-configuration-cache
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: manual-demo-clone
          path: app/build/outputs/apk/deviceTest/
